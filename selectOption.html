<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form style="width: 400px; margin: auto;">
        
        <h1 style="color: red; font-size: 40px;">
            <u><i>Buy Now/Product</i></u>
        </h1>

        <p style="color: blue; font-size: 20px; font-weight: bold;">
            Select something that you want to buy
        </p>

        <label style="font-size: 25px; font-weight: bold;"><i>Select Product</i></label><br>
        <select name="product" style="font-size: 25px; width: 100%; font-weight: bold;">
            <optgroup label="Drinks/Product" style="color: green;">
                <option value="0.5">Coca Cola (0.5$)</option>
                <option value="0.5">Pepsi (0.5$)</option>
                <option value="0.5">Fanta (0.5$)</option>
            </optgroup>

            <optgroup label="Phones/Product" style="color: orange;">
                <option value="1800$">Iphone 18PM 1Tb (18xx$)</option>
                <option value="1500$">Samsung S25ultra (15xx$)</option>
            </optgroup>
        </select>
        <br><br>

        <label style="font-size: 25px; font-weight: bold;"><i>Quantity</i></label><br>
        <input style="font-size: 25px; width: 100%;" type="number"><br><br>

        <button style="font-size: 25px;">Buy</button>
    
    </form>

</body>
</html>
