<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <table width="50%" align="center" border="1" cellpadding="30px">
        
        <tr>
            <th colspan="10">Table</th>
        </tr>
        
        <tr>
            <th colspan="2" rowspan="2">A</th>
            <th colspan="6">B</th>
            <th colspan="2">C</th>
        </tr>
        
        <tr>
            <th colspan="2">D</th>
            <th colspan="2">E</th>
            <th colspan="4">F</th>
        </tr>
        
        <tr>
            <th colspan="6">G</th>
            <th colspan="4" rowspan="2">H</th>
        </tr>
        
        <tr>
            <th colspan="4">I</th>
            <th colspan="2">J</th>
        </tr>
        
        <tr>
            <th colspan="4" rowspan="2">K</th>
            <th colspan="2">L</th>
            <th colspan="2">M</th>
            <th colspan="2">N</th>
        </tr>
        
        <tr>
            <th colspan="2">O</th>
            <th colspan="4">P</th>
        </tr>
    
    </table>
</body>
</html>
