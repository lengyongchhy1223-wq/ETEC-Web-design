<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    
    <form action="">
        
        <h1><u><i>Student Information</i></u></h1>

        <label>Enter Name</label><br>
        <input type="text" name="name" placeholder="Enter your name"><br><br>

        <label>Enter Email</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>

        <label>Gender:</label><br>
        <label>Male</label>
        <input type="checkbox" name="male">
        <label>Female</label>
        <input type="checkbox" name="female"><br><br>

        <label>Student Skill:</label><br>
        <label>Program</label>
        <input type="radio" name="program">
        <label>Network</label>
        <input type="radio" name="network"><br><br>

        <label style="font-size: 30px; color: tomato;">Tech-Skill</label><br>
        <label><i class="bi bi-filetype-html"></i> : 82%</label>
        <input type="range" name="html" value="82"></input><br>
        <label><i class="bi bi-filetype-css"></i> : 60%</label>
        <input type="range" name="css" value="60"></input><br><br>

        <label>Date of birth : </label>
        <input type="date">
    
    </form>

</body>
</html>
