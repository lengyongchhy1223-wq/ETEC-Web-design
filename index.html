    <form action="/register">
        <h1><u><i>Register</i></u></h1>

        <label>Enter FirstName:</label><br>
        <input type="text" name="firstName" placeholder="Enter your FirstName"><br><br>

        <label>Enter LastName:</label><br>
        <input type="text" name="lastName" placeholder="Enter your LastName"><br><br>

        <label>Enter Email:</label><br>
        <input type="email" name="email" placeholder="Enter your Email" required><br><br>

        <label>Enter Password:</label><br>
        <input type="password" name="password" placeholder="Enter your Password" required><br><br>

        <input type="checkbox">
        <label>Remember me.</label><br><br>

        <button type="submit">Register</button>
    </form>

    <form action="/login">
        <h1><u><i>Login</i></u></h1>

        <label>Enter Email:</label><br>
        <input type="email" name="email" placeholder="Enter your Email" required><br><br>

        <label>Enter Password:</label><br>
        <input type="password" name="password" placeholder="Enter your Password" required><br><br>

        <input type="checkbox">
        <label>Remember me.</label><br><br>

        <button type="submit">Login</button>
    </form>

</body>
