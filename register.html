<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="Form">
        <h1><u>Register Form</u></h1>

        <label>Enter Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email" class="input"  required><br><br>

        <label>Enter Password:</label><br>
        <input type="password" name="password" placeholder="Enter your password" class="input" required><br><br>

        <input type="checkbox" name="remember">
        <label>Remember me.</label><br>

        <p class="or">--------------- or ---------------</p>

        <button class="btn">
            <img style="border-radius: 20px;" width="25px" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/250px-Google_Favicon_2025.svg.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail">
            <span>Google Account</span>
        </button><br>

        <button type="submit" class="btnRegister">Register</button>
    </form>
</body>
</html>
